<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas UI Kit · Hyvinvointivaltio</title>

<!-- Ladataan tässä demossa vain varmasti tarvittava komponentti.
     atlas-ui.js:n yhden muun alikomponentin virhe voisi muuten estää
     myös atlas-stat-card-komponentin rekisteröinnin. -->


<style>
:root{
  --paper:#fdfcf7;
  --paper-2:#f7f4ec;
  --ink:#1c2624;
  --muted:#6c766f;
  --line:#e2dcce;
  --forest:#3a6b64;
  --forest-deep:#1f4642;
  --forest-shadow:#12332f;
  --copper:#b56a34;
  --radius:.85rem;
  --serif:Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{
  margin:0;
  color:var(--ink);
  font:16px/1.55 var(--sans);
  background:var(--paper-2);
}
.hero{
  color:var(--paper);
  background:linear-gradient(135deg,var(--forest-shadow),var(--forest-deep) 65%,#244f4a);
}
.hero-inner{
  max-width:1120px;
  margin:auto;
  padding:56px 24px 64px;
}
.eyebrow{
  color:rgba(255,255,255,.7);
  font:600 11px var(--mono);
  letter-spacing:.18em;
  text-transform:uppercase;
}
h1,h2{font-family:var(--serif)}
h1{
  max-width:850px;
  margin:16px 0 12px;
  font-size:clamp(2.5rem,6vw,5rem);
  line-height:1;
}
.hero p{
  max-width:760px;
  margin:0;
  color:rgba(255,255,255,.78);
}
main{
  width:min(1120px,calc(100% - 32px));
  margin:auto;
  padding:28px 0 72px;
}
.panel{
  margin-top:-48px;
  position:relative;
  z-index:2;
  padding:22px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:var(--paper);
  box-shadow:0 20px 45px -32px rgba(18,51,47,.45);
}
.controls{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  align-items:end;
}
.controls label{
  display:grid;
  gap:6px;
  min-width:min(100%,320px);
  color:var(--muted);
  font:600 11px var(--mono);
  letter-spacing:.08em;
  text-transform:uppercase;
}
select{
  padding:11px 13px;
  border:1px solid var(--line);
  border-radius:10px;
  background:white;
  color:var(--ink);
  font:500 14px var(--sans);
}
.status{
  margin-top:14px;
  color:var(--muted);
  font-size:13px;
}
.status.error{color:#9b392c}
.visual{
  margin-top:26px;
  min-height:360px;
}
atlas-stat-card{
  display:block;
  min-height:320px;
  --atlas-paper:#fdfcf7;
  --atlas-line:#ded8ca;
  --atlas-title:#1f4642;
  --atlas-ink:#172421;
  --atlas-radius:14px;
  --atlas-serif:Georgia,serif;
  --atlas-sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
.fallback{
  padding:24px;
  border:1px dashed var(--line);
  border-radius:14px;
  color:var(--muted);
  background:var(--paper);
}
code{font-family:var(--mono)}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow">Hyvinvointivaltio · Atlas UI Kit</div>
    <h1>Tilastovisualisoinnit yhteisestä Atlas-datasta</h1>
    <p>
      Valitse tilastokortti. Visualisointi ladataan suoraan
      tilastomuuttujat/TTT-repositorion Atlas UI Kitistä.
    </p>
  </div>
</header>

<main>
  <section class="panel">
    <div class="controls">
      <label>
        Tilastokortti
        <select id="cardSelect">
          <option value="JULKINEN_VELKA_POLKU">Julkinen velka</option>
          <option value="TYOTTOMYYS_1990_2024">Työttömyys</option>
          <option value="TYOLLISYYS_POLKU">Työllisyys</option>
          <option value="VAESTON_IKAANTYMINEN">Väestön ikääntyminen</option>
          <option value="RAKENNEMUUTOS_KAUPUNGISTUMINEN">Kaupungistuminen</option>
          <option value="SYNTYVYYS_MURROS">Syntyvyys</option>
        </select>
      </label>
    </div>

    <div id="status" class="status">Ladataan Atlas-komponenttia…</div>

    <div class="visual">
      <atlas-stat-card
        id="activeCard"
        card="JULKINEN_VELKA_POLKU"
        data-base="https://harrikayhko.fi/atlas/">
      </atlas-stat-card>

      <noscript>
        <div class="fallback">Visualisointi tarvitsee JavaScriptin.</div>
      </noscript>
    </div>
  </section>
</main>

<script type="module">
const select = document.getElementById("cardSelect");
const card = document.getElementById("activeCard");
const status = document.getElementById("status");

function setStatus(message, isError = false) {
  status.textContent = message;
  status.classList.toggle("error", isError);
}

select.addEventListener("change", () => {
  card.setAttribute("card", select.value);
});

const componentUrl =
  "https://harrikayhko.fi/atlas/components/atlas-stat-card.js";

try {
  await import(componentUrl);

  if (!customElements.get("atlas-stat-card")) {
    throw new Error(
      "Moduuli latautui, mutta atlas-stat-card-komponenttia ei rekisteröity."
    );
  }

  setStatus("Atlas-komponentti ladattu.");
} catch (error) {
  console.error("Atlas-komponentin latausvirhe:", error);

  setStatus(
    "Atlas-komponentin lataus epäonnistui: " +
      (error?.message || "tuntematon virhe"),
    true
  );

  card.innerHTML =
    '<div class="fallback">' +
    '<strong>Visualisointia ei voitu ladata.</strong><br>' +
    'Tarkistettava moduuli: <code>' + componentUrl + '</code>' +
    '</div>';
}
</script>
</body>
</html>
